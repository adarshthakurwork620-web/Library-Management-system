<!DOCTYPE html>
<html>
<head>
    <title>Add Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-400 via-purple-500 to-indigo-600 flex items-center justify-center min-h-screen">

<div class="bg-white/20 backdrop-blur-lg p-8 rounded-2xl shadow-2xl w-full max-w-md">

    <h2 class="text-2xl font-bold text-white text-center mb-6">
        ➕ Add New Book
    </h2>

    <form method="POST" class="space-y-5">

        <!-- TITLE -->
        <div>
            <label class="text-white text-sm">Book Title</label>
            <input type="text" name="title" placeholder="Enter book title"
            class="w-full mt-1 p-3 rounded-lg bg-white/30 text-white placeholder-white outline-none focus:ring-2 focus:ring-white">
        </div>

        <!-- AUTHOR -->
        <div>
            <label class="text-white text-sm">Author</label>
            <input type="text" name="author" placeholder="Enter author name"
            class="w-full mt-1 p-3 rounded-lg bg-white/30 text-white placeholder-white outline-none focus:ring-2 focus:ring-white">
        </div>

        <!-- QUANTITY -->
        <div>
            <label class="text-white text-sm">Quantity</label>
            <input type="number" name="quantity" placeholder="Enter quantity"
            class="w-full mt-1 p-3 rounded-lg bg-white/30 text-white placeholder-white outline-none focus:ring-2 focus:ring-white">
        </div>

        <!-- BUTTON -->
        <button class="w-full bg-green-500 hover:bg-green-600 text-white p-3 rounded-lg transition">
            Add Book
        </button>

    </form>

    <!-- BACK BUTTON -->
    <div class="text-center mt-4">
        <a href="/dashboard" class="text-white underline hover:opacity-80">
            ← Back to Dashboard
        </a>
    </div>

</div>

</body>
</html>
