<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-blue-500 to-purple-600 flex items-center justify-center h-screen">

<div class="bg-white/20 backdrop-blur-lg p-8 rounded-2xl shadow-2xl w-96">

    <h2 class="text-2xl font-bold text-white text-center mb-6">🔐 Login</h2>

    <form method="POST">

        <input type="email" name="email" placeholder="Email"
        class="w-full p-3 rounded-lg bg-white/30 text-white placeholder-white outline-none">

        <input type="password" name="password" placeholder="Password"
        class="w-full p-3 rounded-lg bg-white/30 text-white placeholder-white outline-none">

        <button class="w-full bg-blue-500 hover:bg-blue-600 text-white p-3 rounded-lg">
            Login
        </button>

    </form>

    <p class="text-white text-center mt-4">
        New user?
        <a href="/register" class="underline">Register</a>
    </p>

</div>

</body>
</html>
