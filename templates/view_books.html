<!DOCTYPE html>
<html>
<head>
    <title>All Books</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<!-- NAVBAR -->
<div class="bg-white shadow-lg p-4 flex justify-between items-center">
    <h2 class="text-xl font-bold text-blue-600">📚 All Books</h2>

    <div class="space-x-2">
        <a href="/dashboard" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:opacity-90">Dashboard</a>
        <a href="/my_books" class="bg-purple-500 text-white px-4 py-2 rounded-lg hover:opacity-90">My Books</a>
        <a href="/logout" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:opacity-90">Logout</a>
    </div>
</div>

<div class="p-6">

<!-- SEARCH BAR -->
<form method="GET" class="mb-6 flex gap-2">
    <input 
        type="text" 
        name="search" 
        placeholder="Search by title or author..."
        class="flex-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
    >
    <button class="bg-blue-500 text-white px-6 rounded-lg hover:bg-blue-600">
        Search
    </button>
</form>

<!-- BOOK TABLE -->
<div class="bg-white p-6 rounded-xl shadow">

<div class="overflow-x-auto">
<table class="min-w-full text-center">

<thead class="bg-gray-200">
<tr>
    <th class="p-3">ID</th>
    <th class="p-3">Title</th>
    <th class="p-3">Author</th>
    <th class="p-3">Quantity</th>
    <th class="p-3">Action</th>
</tr>
</thead>

<tbody>

{% for book in books %}
<tr class="border-t hover:bg-gray-100 transition">

    <td class="p-3">{{ book[0] }}</td>
    <td class="p-3 font-semibold">{{ book[1] }}</td>
    <td class="p-3">{{ book[2] }}</td>
    <td class="p-3">{{ book[3] }}</td>

    <td class="p-3 space-x-2">
        {% if role == 'student' %}
        <!-- Issue -->
        <a href="/issue/{{ book[0] }}" 
           class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600">
           Issue
        </a>

        <!-- Return -->
            <a href="/return/{{ book[0] }}" 
            class="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600">
            Return
            </a>
        {% endif %}

        {% if role == 'admin' %}
        <!-- Edit -->
        <a href="/edit/{{ book[0] }}" 
           class="bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600">
           Edit
        </a>

        <!-- Delete -->
        <a href="/delete/{{ book[0] }}" 
           class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">
           Delete
        </a>
        {% endif %}

    </td>

</tr>
{% endfor %}

</tbody>

</table>


</div>

</div>

</div>

</body>
</html>
